name: Build and Preview Site

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "preview-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout for cleanup
        if: github.event.action == 'closed'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Ruby
        if: github.event.action != 'closed'
        uses: ruby/setup-ruby@v1.162.0
        with:
          ruby-version: '3.2.2'
          bundler-cache: true

      - name: Build PR preview
        if: github.event.action != 'closed'
        env:
          JEKYLL_ENV: production
          JEKYLL_SITE_URL: https://${{ github.repository_owner }}.github.io
          JEKYLL_BASEURL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}
        run: |
          bundle exec jekyll build

          # Block crawlers from indexing PR previews.
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

      - name: Deploy PR preview
        if: github.event.action != 'closed'
        id: deploy-preview
        uses: rossjrw/pr-preview-action@v1.6.3
        with:
          source-dir: ./_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: false

      - name: Comment PR with preview URL
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🚀 **Preview deployment for PR #${{ github.event.pull_request.number }}**

            🌐 **Preview URL**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}/

            _This preview is updated automatically when new commits are pushed to this PR._

      - name: Cleanup PR preview on close
        if: github.event.action == 'closed'
        uses: rossjrw/pr-preview-action@v1.6.3
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
